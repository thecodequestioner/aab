name: build-and-validate

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: make test
      - name: Rebuild everything and validate
        run: make all
      - name: Generated text files must match the committed ones
        run: git diff --exit-code -- . ':!*.png' ':!*.svg'
      - name: Validate every datapackage against the Frictionless spec
        run: |
          for f in data/datasets/*/datapackage.json; do
            frictionless validate "$f"
          done
